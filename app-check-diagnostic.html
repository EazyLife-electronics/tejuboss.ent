<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TejuBoss App Check diagnostic</title>
<style>
body{font:16px system-ui,sans-serif;max-width:680px;margin:40px auto;padding:0 18px;line-height:1.5}
main{border:1px solid #ddd;border-radius:14px;padding:22px}
#status{padding:12px;border-radius:8px;background:#f2f2f2;white-space:pre-wrap;overflow-wrap:anywhere}
.muted{color:#555;font-size:14px}
</style>
</head>
<body>
<main>
<h1>TejuBoss App Check test</h1>
<p>This page checks token generation and then calls a public-safe, App Check-protected delivery-options endpoint. It never displays or stores the token.</p>
<p id="status" role="status" aria-live="polite">Starting Firebase…</p>
<p class="muted">This diagnostic does not create orders, change inventory, enable enforcement or modify security rules.</p>
</main>
<script type="module">
import { getToken } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";
import { initFirebase } from "./js/firebase.mjs";
const status = document.getElementById("status");
const show = (message) => { status.textContent = message; };
try {
  const { app, appCheck } = initFirebase();
  if (!appCheck) throw new Error("Firebase App Check did not initialize.");
  const tokenResult = await getToken(appCheck, false);
  if (!tokenResult || !tokenResult.token) throw new Error("Firebase returned an empty App Check token.");

  show("TOKEN SUCCESS: This browser obtained an App Check token.\nChecking protected callable…");
  const functions = getFunctions(app, "europe-west1");
  const getDeliveryOptions = httpsCallable(functions, "getPublicDeliveryOptions");
  await getDeliveryOptions({});

  show("FULL SUCCESS: App Check token generated and accepted by the protected getPublicDeliveryOptions callable.\nNo order, stock or customer data was changed.\nToken value: hidden.");
} catch (error) {
  console.error("TejuBoss App Check diagnostic failed:", error);
  const code = error?.code || "unknown";
  if (code === "functions/invalid-argument") {
    show("TOKEN SUCCESS: The protected callable reached its handler, which rejected the request as invalid for this browser session. This still confirms App Check was accepted.\nNo order, stock or customer data was changed.");
  } else {
    show("TOKEN CHECK PASSED, CALLABLE NOT CONFIRMED: " + code + "\nThe protected endpoint may not be deployed yet, or the request was rejected. No order, stock or customer data was changed. Please send this result.");
  }
}
</script>
</body>
</html>
