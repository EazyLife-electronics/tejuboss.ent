<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
  <title>Track Your Request | Tejuboss Enterprise</title>
    <link rel="icon" type="image/png" href="assets/pictures/icon_dark.png" />
    <link rel="apple-touch-icon" href="assets/pictures/icon_dark.png" />
    <script>
        (function () {
            var saved = localStorage.getItem('tejuboss-theme');
            var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --teal: #DC2626; --lime: #F87171; --dark: #1a1a1a; }
        body { font-family: 'DM Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        h1, h2, .font-syne { font-family: 'Poppins', sans-serif; }
        .bg-tejuboss { background: linear-gradient(135deg, #DC2626, #F87171); }
        .text-teal { color: var(--teal); }
        .dark body { background: #0f1715; }
        .nav-menu { position: relative; }
        .nav-menu-panel { position: absolute; top: calc(100% + 8px); right: 0; left: auto; background: #fff; border: 1px solid #eee; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); padding: 8px; width: min(250px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto; z-index: 60; }
        .dark .nav-menu-panel { background: #182420; border-color: #2a3835; }
        .nav-menu-panel a { display: block; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 700; color: #1a1a1a; }
        .dark .nav-menu-panel a { color: #eef2f0; }
        .nav-menu-panel a:hover { background: #f0fdfb; }
        .dark .nav-menu-panel a:hover { background: #1c2925; }
        .track-input { text-transform: uppercase; letter-spacing: 0.05em; }
        .step-line { flex: 1; height: 3px; background: #e5e7eb; }
        .dark .step-line { background: #2a3835; }
        .step-line.done { background: var(--teal); }
        .step-dot { width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: #e5e7eb; color: #9ca3af; font-size: 0.8rem; }
        .dark .step-dot { background: #2a3835; color: #6b7a76; }
        .step-dot.done { background: var(--teal); color: #fff; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-[#0f1715] pb-16">

<header class="bg-white/90 dark:bg-[#0f1715]/90 backdrop-blur-md border-b dark:border-[#2a3835] sticky top-0 z-50 p-4 shadow-sm">
    <div class="max-w-2xl mx-auto flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-2">
            <img id="navLogo" src="assets/pictures/logo_black_transparent.png" class="h-9" alt="Tejuboss Enterprise">
        </a>
        <div class="flex items-center gap-2">
            <button id="themeToggle" type="button" aria-label="Toggle dark mode" class="w-10 h-10 rounded-full border border-gray-200 dark:border-[#2a3835] dark:bg-[#182420] flex items-center justify-center text-gray-700 dark:text-gray-200">
                <i class="fas fa-moon"></i>
            </button>
            <div class="nav-menu">
                <button id="navMenuBtn" type="button" aria-label="Open menu" class="w-10 h-10 rounded-full border border-gray-200 dark:border-[#2a3835] dark:bg-[#182420] flex items-center justify-center text-gray-700 dark:text-gray-200">
                    <i class="fas fa-bars"></i>
                </button>
                <div id="navMenuPanel" class="nav-menu-panel hidden">
<a href="index.html"><i class="fas fa-house fa-fw"></i> Home</a>
<a href="shop.html"><i class="fas fa-store fa-fw"></i> Shop</a>
<a href="track.html"><i class="fas fa-truck-fast fa-fw"></i> Track Request</a>
<a href="index.html#services"><i class="fas fa-layer-group fa-fw"></i> What We Offer</a>
<a href="index.html#contact"><i class="fas fa-address-card fa-fw"></i> Contact</a>
</div>
            </div>
            <a href="https://wa.me/2347079557886" target="_blank" class="w-10 h-10 rounded-full bg-[#25D366] text-white flex items-center justify-center">
                <i class="fab fa-whatsapp"></i>
            </a>
        </div>
    </div>
</header>

<main class="max-w-2xl mx-auto p-4">
    <div class="mt-6 mb-6 text-center">
        <h1 class="text-2xl font-black text-gray-900 dark:text-gray-100 tracking-tight">Track Your Order</h1>
        <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Enter the tracking code from your order confirmation.</p>
    </div>

    <div class="flex gap-2 mb-8">
        <input id="trackInput" placeholder="Enter your 32-character tracking token" maxlength="32" minlength="32"
               class="track-input flex-1 p-4 rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-[#DC2626] outline-none dark:bg-[#182420] dark:text-gray-100 font-bold text-center">
        <button onclick="trackOrder()" id="trackBtn" class="bg-gray-900 text-white px-6 rounded-2xl font-bold text-sm">
            <i class="fas fa-magnifying-glass"></i>
        </button>
    </div>

    <div id="trackResult"></div>

    <div id="myOrdersSection" class="hidden mt-10">
        <h2 class="text-sm font-black uppercase text-gray-400 mb-3 px-1">Your Orders on This Device</h2>
        <div id="myOrdersList" class="space-y-3"></div>
    </div>
</main>

<script>
    function applyShopThemeVisuals() {
        var isDark = document.documentElement.classList.contains('dark');
        var logo = document.getElementById('navLogo');
        var icon = document.querySelector('#themeToggle i');
        logo.src = isDark ? 'assets/pictures/logo_white_transparent.png' : 'assets/pictures/logo_black_transparent.png';
        if (icon) icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
    }
    applyShopThemeVisuals();

    document.getElementById('themeToggle').addEventListener('click', function () {
        var isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('tejuboss-theme', isDark ? 'dark' : 'light');
        applyShopThemeVisuals();
    });

    var menuBtn = document.getElementById('navMenuBtn');
    var menuPanel = document.getElementById('navMenuPanel');
    menuBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        menuPanel.classList.toggle('hidden');
    });
    document.addEventListener('click', function (e) {
        if (!menuPanel.classList.contains('hidden') && !menuPanel.contains(e.target) && e.target !== menuBtn) {
            menuPanel.classList.add('hidden');
        }
    });
</script>

<script type="module">
    import { getPublicOrderTracking } from './js/commerce-store.mjs';

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
    }
    function readableStatus(status) {
      return ({
        submitted: 'Request received, awaiting review',
        approved: 'Request approved',
        rejected: 'Request declined'
      })[status] || 'Status update pending';
    }
    function statusStyle(status) {
      if (status === 'approved') return 'text-green-700 bg-green-50';
      if (status === 'rejected') return 'text-red-700 bg-red-50';
      return 'text-amber-700 bg-amber-50';
    }
    function renderTracking(result, token) {
      const updated = result.updatedAt?.toDate ? result.updatedAt.toDate().toLocaleString() : 'Just received';
      return `
        <div class="bg-white dark:bg-[#182420] border border-gray-100 dark:border-[#2a3835] rounded-2xl p-5 shadow-sm">
          <p class="text-[10px] font-black uppercase text-gray-400 mb-2">Order request tracking</p>
          <p class="text-xs text-gray-500 mb-2">Reference token</p>
          <p class="font-mono text-sm break-all mb-4">${escapeHtml(token)}</p>
          <p class="inline-block rounded-full px-3 py-2 text-xs font-bold ${statusStyle(result.status)}">${escapeHtml(readableStatus(result.status))}</p>
          <p class="text-xs text-gray-500 mt-4">Last updated: ${escapeHtml(updated)}</p>
          <p class="text-xs text-gray-500 mt-3">Your request is not yet a confirmed sale. TejuBoss will contact you after checking product availability, current prices and fulfilment details.</p>
        </div>`;
    }

    window.trackOrder = async function () {
      const input = document.getElementById('trackInput');
      const token = input.value.trim().toLowerCase();
      const resultEl = document.getElementById('trackResult');
      if (!token) return;
      const btn = document.getElementById('trackBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      resultEl.innerHTML = '';
      try {
        const result = await getPublicOrderTracking(token);
        resultEl.innerHTML = result
          ? renderTracking(result, token)
          : '<div class="text-center py-8 text-gray-400 text-sm">No request found. Check the full tracking token and try again.</div>';
        if (result) {
          let saved = [];
          try { saved = JSON.parse(localStorage.getItem('tejuboss_my_orders')) || []; } catch (_) {}
          if (!saved.includes(token)) {
            saved.unshift(token);
            localStorage.setItem('tejuboss_my_orders', JSON.stringify(saved.slice(0, 30)));
          }
        }
      } catch (error) {
        console.error(error);
        resultEl.innerHTML = '<div class="text-center py-8 text-red-400 text-sm">Could not retrieve tracking status. Please try again.</div>';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-magnifying-glass"></i>';
      }
    };

    async function loadMyOrders() {
      let tokens = [];
      try { tokens = JSON.parse(localStorage.getItem('tejuboss_my_orders')) || []; } catch (_) {}
      if (!tokens.length) return;
      document.getElementById('myOrdersSection')?.classList.remove('hidden');
      const list = document.getElementById('myOrdersList');
      if (!list) return;
      const rows = await Promise.all(tokens.map(async token => {
        try { const result = await getPublicOrderTracking(token); return result ? { token, result } : null; }
        catch (_) { return null; }
      }));
      list.innerHTML = rows.filter(Boolean).map(({ token, result }) => `
        <button type="button" class="block w-full text-left bg-white dark:bg-[#182420] border border-gray-100 dark:border-[#2a3835] rounded-xl p-3 mb-2" data-track-token="${escapeHtml(token)}">
          <span class="block font-mono text-xs break-all">${escapeHtml(token)}</span>
          <span class="block text-xs text-gray-500 mt-1">${escapeHtml(readableStatus(result.status))}</span>
        </button>`).join('') || '<p class="text-xs text-gray-400 text-center py-3">No saved requests found on this device.</p>';
      list.querySelectorAll('[data-track-token]').forEach(button => button.addEventListener('click', () => {
        document.getElementById('trackInput').value = button.dataset.trackToken;
        window.trackOrder();
      }));
    }

    const params = new URLSearchParams(location.search);
    const initial = params.get('code') || params.get('token');
    if (initial) {
      document.getElementById('trackInput').value = initial;
      window.trackOrder();
    }
    loadMyOrders();
</script>
</body>
</html>
