name: Tejuboss legacy foundation checks

# The original commerce domain tests describe the retired legacy collections
# and callable-function architecture. The clean TejuBoss rebuild is validated
# by commerce-foundation-ci.yml instead. Keep these checks scoped to the
# legacy foundation branch so they do not block the clean rebuild PR.

on:
  push:
    branches: [tejuboss-foundation]
  pull_request:
    branches: [tejuboss-foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-commerce-domain:
    name: Legacy commerce checks
    if: github.ref == 'refs/heads/tejuboss-foundation' || github.base_ref == 'tejuboss-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate legacy branch modules
        working-directory: functions
        run: find src -name '*.mjs' -print0 | xargs -0 -n1 node --check && find ../admin/js -name '*.mjs' -print0 | xargs -0 -n1 node --check && find ../js -name '*.mjs' -print0 | xargs -0 -n1 node --check && node ../scripts/check-inline-modules.mjs
      - name: Run legacy domain tests
        working-directory: functions
        run: npm test
