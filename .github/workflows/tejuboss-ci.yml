name: Tejuboss foundation checks

on:
  push:
    branches: [tejuboss-foundation]
  pull_request:
    branches: [main, tejuboss-foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commerce-tests:
    name: Commerce and Firestore security tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        working-directory: functions
        run: npm install
      - name: Run domain tests
        working-directory: functions
        run: npm test
      - name: Run Firestore security rules tests
        working-directory: functions
        run: npm run test:rules
