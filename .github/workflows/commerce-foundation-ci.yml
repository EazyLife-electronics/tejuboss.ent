name: Tejuboss clean commerce rules

on:
  push:
    branches: [feature/eazylife-foundation-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commerce-rules-emulator:
    name: Clean commerce Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install test dependencies
        working-directory: functions
        run: npm install
      - name: Run clean commerce rules emulator suite
        working-directory: functions
        run: npm run test:commerce-rules
